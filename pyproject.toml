[project]
name = "modeldirector"
version = "0.1.0"
description = "Stateless AI model selection engine. Picks the cheapest capable model for a task."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Aniket Karne", email = "aniket@aniketkarneai.com" },
]
requires-python = ">=3.11"
keywords = ["ai", "llm", "model-selection", "routing", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
laya = [
    # Laya: non-autoregressive System-1 decision engine used as a cheap
    # alternative to LLM-as-a-judge for scoring candidate models.
    # See docs/laya.md and `selector.backend: laya` in the config.
    "laya>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
modeldirector = "modeldirector.adapters.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modeldirector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "benchmark: marks tests as benchmark (deselect with '-m \"not benchmark\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
