# ModelDirector example config
#
# Use with:
#   modeldirector select -c examples/config.yaml -p "Summarise this article"
#   modeldirector select -c examples/config.yaml -f path/to/prompt.txt
#   modeldirector validate -c examples/config.yaml
#
# Model ids are model names, not tier labels. The engine does not know what
# "cheap" or "premium" mean - you name the candidates, declare their real
# per-1M-token cost, and tag their strengths. The policy decides.
#
# Selector and candidate model ids + per-1M-token prices below were verified
# against the OpenRouter catalog on 2026-11-14.

selector:
  provider: openrouter
  model: openai/gpt-6-luna
  # api_key is read from $OPENROUTER_API_KEY by default.
  # temperature is deliberately unset: current reasoning models reject
  # non-default sampling params (HTTP 400). Set it only for models that
  # accept it.

policy:
  type: cheapest_capable
  threshold: 80   # require >= 80% confidence before accepting a model

models:
  - id: luna
    name: openai/gpt-6-luna
    display_name: GPT-6 Luna
    description: |
      OpenAI's small, fast, low-cost general-purpose model. Good for simple
      classification, routing, short summarisation, and basic Q&A. Weaker at
      long-horizon reasoning, complex multi-step code generation, and nuanced
      prose.
    strengths:
      - classification
      - routing
      - short_summarisation
      - simple_qa
    capabilities:
      reasoning: 65
      coding: 70
      context: 70
      creativity: 60
    priority: 1
    cost:
      input: 0.10     # USD per 1M input tokens
      output: 0.50    # USD per 1M output tokens

  - id: sonnet
    name: anthropic/claude-sonnet-5.5
    display_name: Claude Sonnet 5.5
    description: |
      Anthropic's mid-tier model. Strong at coding, instruction following,
      and long-context reasoning. 200k context window. The default workhorse
      for most agentic tasks.
    strengths:
      - coding
      - architecture
      - long_context
      - refactoring
      - instruction_following
    capabilities:
      reasoning: 88
      coding: 92
      context: 95
      creativity: 85
    priority: 2
    cost:
      input: 2.00
      output: 10.00

  - id: opus
    name: anthropic/claude-opus-5.5
    display_name: Claude Opus 5.5
    description: |
      Anthropic's frontier model. Best-in-class reasoning, complex multi-step
      planning, and nuanced code generation. Use only when cheaper models
      are unlikely to succeed.
    strengths:
      - hard_reasoning
      - complex_coding
      - architecture_design
      - long_horizon_planning
    capabilities:
      reasoning: 95
      coding: 95
      context: 99
      creativity: 92
    priority: 3
    cost:
      input: 4.00
      output: 20.00
